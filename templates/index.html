<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throughline - Compliance-Gated GTM Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Throughline</h1>
                <p class="tagline">Compliance-Gated GTM Agent • Powered by Kalibr</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- GTM Campaign Panel -->
            <div class="search-panel" id="searchPanel">
                <div class="search-input-group">
                    <label for="persona">Prospect Persona</label>
                    <select id="persona" class="search-input">
                        <option value="CFO">CFO / Financial Officer</option>
                        <option value="Accountant">Controller / Accountant</option>
                        <option value="Supply Chain Director">Supply Chain Director</option>
                    </select>
                </div>

                <div class="search-input-group">
                    <label for="query">Search Query</label>
                    <input
                        type="text"
                        id="query"
                        class="search-input"
                        placeholder="e.g., CFOs at fintech companies"
                        value="CFOs at fintech companies with compliance focus"
                    />
                </div>

                <div class="search-input-group">
                    <label for="region">Region</label>
                    <select id="region" class="search-input">
                        <option value="US">United States (TCPA, CAN-SPAM)</option>
                        <option value="EU">European Union (GDPR)</option>
                        <option value="CA">Canada (CASL)</option>
                    </select>
                </div>

                <button class="search-btn" id="searchBtn" onclick="startSearch()">
                    <span id="searchBtnText">🚀 Launch Campaign</span>
                    <span id="searchSpinner" class="spinner hidden"></span>
                </button>
            </div>

            <!-- Loading State -->
            <div class="loading-panel hidden" id="loadingPanel">
                <div class="progress-section">
                    <h2>Running Kalibr GTM Agent...</h2>
                    <div class="progress-steps">
                        <div class="progress-step active">
                            <div class="step-icon">🔍</div>
                            <div class="step-label">Discovering prospects</div>
                        </div>
                        <div class="progress-step">
                            <div class="step-icon">✅</div>
                            <div class="step-label">Compliance check</div>
                        </div>
                        <div class="progress-step">
                            <div class="step-icon">📧</div>
                            <div class="step-label">Generating outreach</div>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                </div>
            </div>

            <!-- Results Panel -->
            <div class="results-panel hidden" id="resultsPanel">
                <div class="results-header">
                    <h2>Compliant Prospects</h2>
                    <button class="back-btn" onclick="resetSearch()">← New Campaign</button>
                </div>
                <div class="results-list" id="resultsList"></div>
            </div>

            <!-- Error Panel -->
            <div class="error-panel hidden" id="errorPanel">
                <div class="error-content">
                    <h2>Campaign Error</h2>
                    <p id="errorMessage"></p>
                    <button class="retry-btn" onclick="resetSearch()">Try Again</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Throughline • Compliance-Gated GTM • Powered by Kalibr + Apify + Claude AI</p>
        </footer>
    </div>

    <script>
        async function startSearch() {
            const persona = document.getElementById('persona').value;
            const query = document.getElementById('query').value.trim();
            const region = document.getElementById('region').value;

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            document.getElementById('searchPanel').classList.add('hidden');
            document.getElementById('loadingPanel').classList.remove('hidden');
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('errorPanel').classList.add('hidden');

            try {
                const startResp = await fetch('/api/gtm/campaign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ persona, query, region, budget: 10.0 })
                });

                const startData = await startResp.json();
                const campaignId = startData.campaign_id;

                let attempts = 0;
                const maxAttempts = 60;

                while (attempts < maxAttempts) {
                    const resultsResp = await fetch(`/api/gtm/campaign/${campaignId}`);
                    const campaign = await resultsResp.json();

                    if (campaign.status === 'success' && campaign.prospects && campaign.prospects.length > 0) {
                        displayResults(campaign);
                        return;
                    } else if (campaign.status === 'error') {
                        showError(campaign.error || 'Campaign failed');
                        return;
                    }

                    const loadingText = document.querySelector('.progress-section h2');
                    if (loadingText) {
                        loadingText.innerText = `Running Kalibr GTM Agent... (${attempts}s)`;
                    }

                    await new Promise(r => setTimeout(r, 1000));
                    attempts++;
                }

                showError('Campaign still running. Try again in a moment.');
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        function displayResults(campaign) {
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('resultsPanel').classList.remove('hidden');
            document.getElementById('errorPanel').classList.add('hidden');

            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            const prospects = campaign.prospects || [];
            const connections = campaign.connections || [];

            if (prospects.length === 0) {
                showError('No compliant prospects found.');
                return;
            }

            prospects.forEach((prospect, index) => {
                const connection = connections.find(c => c.prospect_name === prospect.name);
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-rank">#${index + 1}</div>
                    <div class="result-content">
                        <h3 class="result-name">${prospect.name || 'Unknown'}</h3>
                        <div class="result-meta">
                            <span class="meta-item">
                                <span class="meta-label">Research:</span>
                                <span>${prospect.research_summary ? prospect.research_summary.substring(0, 50) + '...' : 'Analyzed'}</span>
                            </span>
                            ${connection ? `<span class="meta-item"><span class="meta-label">Subject:</span><span>${connection.subject.substring(0, 35)}...</span></span>` : ''}
                        </div>
                        <p class="result-reason">✅ Compliance Approved ${connection?.ai_disclosed ? '| 🤖 AI Disclosed' : ''}</p>
                    </div>
                    <div class="result-score" style="background: #10b981;">
                        <div class="score-number">PASS</div>
                        <div class="score-label">Compliant</div>
                    </div>
                `;
                resultsList.appendChild(card);
            });

            const governance = campaign.governance || {};
            const metrics = governance.pipeline_metrics || {};
            const costSummary = governance.cost_summary || {};

            const metricsDiv = document.createElement('div');
            metricsDiv.style.cssText = 'margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);';
            metricsDiv.innerHTML = `
                <h3 style="margin-top: 0;">📊 Governance Metrics</h3>
                <p>📍 Discovery: ${(metrics.discovery_rate * 100).toFixed(0)}% | ✅ Compliance: ${(metrics.compliance_rate * 100).toFixed(0)}% | 📧 Outreach: ${(metrics.outreach_rate * 100).toFixed(0)}%</p>
                <p style="font-size: 0.9em; color: #aaa;">💰 Cost: $${costSummary.total_spent?.toFixed(2) || '0.00'} | Connected: ${connections.length}/${prospects.length}</p>
            `;
            resultsList.appendChild(metricsDiv);
        }

        function showError(message) {
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('errorPanel').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }

        function resetSearch() {
            document.getElementById('searchPanel').classList.remove('hidden');
            document.getElementById('loadingPanel').classList.add('hidden');
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('errorPanel').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('query').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startSearch();
            });
        });
    </script>
</body>
</html>
