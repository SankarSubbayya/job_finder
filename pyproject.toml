[project]
name = "market-intelligence"
version = "1.0.0"
description = "Autonomous lead intelligence agent that discovers, enriches, and qualifies prospects using web scraping and AI-powered scoring"
authors = [
    {name = "MarketIntelligence Team", email = "team@marketintelligence.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["marketing", "lead-generation", "gtm", "agents", "apify", "sales"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]

dependencies = [
    "apify-client>=1.7.0",
    "anthropic>=0.21.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "flask>=2.3.0",
    "werkzeug>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
